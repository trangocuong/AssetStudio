name: AssetStudioBuild

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore AssetStudio.sln

      - name: Restore .NET SDK packages
        run: dotnet restore AssetStudioGUI/AssetStudioGUI.csproj

      - name: Download FBX SDK
        run: |
          md fbx
          cd fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" -ArgumentList '/S' -Wait
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          Start-Process -FilePath "fbxpdb.exe" -ArgumentList '/S' -Wait
          cd ..

      - name: Build Native Projects
        run: |
          msbuild Texture2DDecoderNative/Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=Win32
          msbuild Texture2DDecoderNative/Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=x64
          msbuild AssetStudioFBXNative/AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=Win32
          msbuild AssetStudioFBXNative/AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Publish .NET 8.0 app
        run: dotnet publish AssetStudioGUI/AssetStudioGUI.csproj -c Release -f net8.0-windows --no-self-contained -v minimal

      - name: Upload .NET 8 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net8
          path: AssetStudioGUI/bin/Release/net8.0-windows/publish
